# SPDX-License-Identifier: AGPL-3.0-only
# P0-6: versioned schema migrations (Alembic).
#
# NOTE: this file is read by Alembic with the OS locale encoding (GBK on a
# Chinese Windows install), so it must stay ASCII-only. Put any Chinese
# explanation in alembic/env.py (a .py file, UTF-8 by definition) instead of
# here -- otherwise `alembic upgrade head` dies with UnicodeDecodeError.
#
# Why Alembic on top of the startup `create_all + ensure_schema`:
#   * create_all/ensure_schema only guarantee "the current code can run"; they
#     cannot answer "which version is this database, what was applied, how do
#     we roll back" -- the first question asked during an incident;
#   * changes must be reviewable and rehearsable in test environments: one
#     revision = one change unit, entering code review, CI and the change log.
# Dual-track by design (they do not conflict):
#   * the service still runs create_all + ensure_schema on boot so an old
#     deployment upgrades in place without downtime;
#   * the release flow is `alembic upgrade head` first, then start the service;
#     CI runs the same command on an empty database on every push;
#   * 0001_baseline equals create_all + ensure_schema and is idempotent: on an
#     existing database it only inserts one row into alembic_version.
#
# The URL is intentionally NOT set here (see env.py): migrations and the
# application must resolve DATABASE_URL through the same path, otherwise
# "migrated database A but the service connects to B" becomes possible.

[alembic]
script_location = alembic
prepend_sys_path = .
# overwritten by env.py using app.config.DATABASE_URL
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
