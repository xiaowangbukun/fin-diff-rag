[pytest]
# 运行方式（仓库根目录）：pytest backend/tests -q
# 也可在 backend 目录下：pytest tests -q
#
# pythonpath 让 `import app.xxx` 无需安装包即可命中 backend/app，
# rootdir 自动定位到本文件所在目录（backend），两条调用方式等价。
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra -q

# 安全起见：任何用例都不允许访问网络与本机的 8000 端口服务。
# 测试只覆盖纯逻辑与真实 PostgreSQL（#21 起 DATABASE_URL 由 CI service 或
# tests/conftest.py 默认值提供，每用例独立 schema 隔离，不碰项目默认库）。
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::ResourceWarning
